services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: notepilot-postgres
    environment:
      POSTGRES_DB: notepilot
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5435:5432"
    volumes:
      - notepilot_pg_data:/var/lib/postgresql/data
     
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d notepilot"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  notepilot_pg_data: